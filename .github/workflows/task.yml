name: Qoder CN Daily Sign-in

on:
  schedule:
    # 北京时间每天 10:05，GitHub Actions 使用 UTC
    - cron: '35 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      QODER_TOKEN_1: ${{ secrets.QODER_TOKEN_1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Qoder sign-in
        shell: bash
        run: |
          set -euo pipefail

          # 临时配置文件只保存环境变量名称，不保存真实 token
          umask 077
          config="$RUNNER_TEMP/qoder-accounts.json"

          cat > "$config" <<'JSON'
          {
            "accounts": [
              {
                "name": "账号一",
                "token_env": "QODER_TOKEN_1",
                "enabled": true
              }
            ]
          }
          JSON

          python qoder_signin.py \
            --config "$config" \
            run \
            --interval 3
